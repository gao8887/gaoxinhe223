<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>语音识别 - gaoxinhe</title>
  <link rel="stylesheet" href="css/gxh_style.css">
  <style>
    .gxh_api_bar {
      background: rgba(255, 142, 176, 0.12);
      border: 1px solid rgba(255, 142, 176, 0.4);
      border-radius: 12px;
      padding: 14px 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 13px;
    }
    .gxh_api_bar .gxh_method_tag {
      background: linear-gradient(135deg, #ff8eaf, #ff4e9a);
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      color: #fff;
    }
    .gxh_api_bar .gxh_api_url { font-family: Consolas, monospace; color: rgba(255,255,255,0.9); }
    .gxh_api_bar .gxh_sep { color: rgba(255,255,255,0.3); }

    .gxh_back_link { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 14px; }
    .gxh_back_link:hover { color: #ff8eaf; }

    .gxh_layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      min-height: 560px;
    }
    @media (max-width: 900px) { .gxh_layout { grid-template-columns: 1fr; } }

    .gxh_panel {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
    }
    .gxh_panel h3 {
      font-size: 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .gxh_recorder_area {
      border: 2px dashed rgba(255, 142, 176, 0.4);
      border-radius: 14px;
      padding: 30px 20px;
      text-align: center;
      background: rgba(255,142,176,0.05);
      margin-bottom: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 200px;
    }

    .gxh_mic_btn {
      width: 88px; height: 88px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 38px;
      background: linear-gradient(135deg, #ff8eaf, #ff4e9a);
      color: #fff;
      transition: all 0.3s;
      box-shadow: 0 4px 20px rgba(255,78,154,0.3);
      margin-bottom: 16px;
    }
    .gxh_mic_btn:hover { transform: scale(1.05); }
    .gxh_mic_btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .gxh_mic_btn.gxh_recording {
      background: linear-gradient(135deg, #ff4e4e, #c0392b);
      animation: gxh_pulse 1.2s ease-in-out infinite;
    }
    @keyframes gxh_pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,78,154,0.6); }
      50% { box-shadow: 0 0 0 18px rgba(255,78,154,0); }
    }

    .gxh_rec_status {
      font-size: 15px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 6px;
    }
    .gxh_rec_status.gxh_recording { color: #ff4e4e; font-weight: bold; }
    .gxh_rec_time {
      font-family: Consolas, monospace;
      font-size: 20px;
      color: #ff8eaf;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }
    .gxh_rec_hint { font-size: 12px; color: rgba(255,255,255,0.35); }

    .gxh_or_divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 14px 0;
      color: rgba(255,255,255,0.3);
      font-size: 12px;
    }
    .gxh_or_divider::before, .gxh_or_divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.15);
    }

    .gxh_upload_btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.3s;
    }
    .gxh_upload_btn:hover { background: rgba(255,142,176,0.15); border-color: rgba(255,142,176,0.4); color: #ff8eaf; }
    .gxh_upload_btn input[type="file"] { display: none; }

    .gxh_audio_preview {
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,142,176,0.3);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .gxh_audio_info {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }
    .gxh_audio_preview audio {
      width: 100%;
      border-radius: 8px;
    }

    .gxh_btn_row { display: flex; gap: 10px; }
    .gxh_btn_primary {
      flex: 1;
      background: linear-gradient(135deg, #ff8eaf, #ff4e9a);
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.3s;
    }
    .gxh_btn_primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(255,78,154,0.35); }
    .gxh_btn_primary:disabled { opacity: 0.45; cursor: not-allowed; }

    .gxh_btn_secondary {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.7);
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    }
    .gxh_btn_secondary:hover { background: rgba(255,255,255,0.15); }

    .gxh_result_box {
      flex: 1;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 18px 20px;
      font-size: 15px;
      line-height: 1.9;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 200px;
    }
    .gxh_result_box::-webkit-scrollbar { width: 6px; }
    .gxh_result_box::-webkit-scrollbar-thumb { background: rgba(255,142,176,0.4); border-radius: 3px; }
    .gxh_result_empty { color: rgba(255,255,255,0.3); text-align: center; padding-top: 40px; }
    .gxh_result_empty .gxh_big { font-size: 44px; display: block; margin-bottom: 12px; }

    .gxh_loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      gap: 10px;
    }
    .gxh_spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(255,142,176,0.2);
      border-top-color: #ff8eaf;
      border-radius: 50%;
      animation: gxh_spin 0.9s linear infinite;
    }
    @keyframes gxh_spin { to { transform: rotate(360deg); } }

    .gxh_model_info {
      background: rgba(255,142,176,0.08);
      border: 1px solid rgba(255,142,176,0.25);
      border-radius: 10px;
      padding: 12px 16px;
      margin-top: 14px;
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      display: none;
    }
    .gxh_model_info.show { display: block; }
    .gxh_model_info b { color: #ff8eaf; }
  </style>
</head>
<body>
  <canvas id="gxh_canvas_bg"></canvas>

  <div class="gxh_container">
    <a class="gxh_back_link" href="index.html">← 返回首页</a>
    <div style="height:12px"></div>

    <div class="gxh_api_bar">
      <span class="gxh_method_tag">ASR</span>
      <span class="gxh_api_url">POST /api/asr/recognize</span>
      <span class="gxh_sep">·</span>
      <span>模型: <b style="color:#ff8eaf">qwen/qwen3.8-omni-flash</b></span>
    </div>

    <div class="gxh_layout">
      <div class="gxh_panel">
        <h3>🎤 录制 / 上传语音</h3>

        <div id="gxh_recorder_area" class="gxh_recorder_area">
          <button class="gxh_mic_btn" id="gxh_mic_btn" title="点击开始/停止录音">🎙️</button>
          <div class="gxh_rec_status" id="gxh_rec_status">点击麦克风开始录音</div>
          <div class="gxh_rec_time" id="gxh_rec_time">00:00</div>
          <div class="gxh_rec_hint">首次使用需授权麦克风，录音建议不超过 5 分钟</div>
        </div>

        <div class="gxh_or_divider">—— 或 ——</div>

        <label class="gxh_upload_btn">
          <span>📁 选择音频文件</span>
          <input type="file" id="gxh_file_input" accept="audio/*">
        </label>

        <div id="gxh_audio_preview" style="display:none">
          <div class="gxh_audio_preview">
            <div class="gxh_audio_info">
              <span id="gxh_audio_name">audio.webm</span>
              <span id="gxh_audio_size">0 KB</span>
            </div>
            <audio id="gxh_audio_player" controls></audio>
          </div>
          <div class="gxh_btn_row">
            <button class="gxh_btn_primary" id="gxh_btn_send">🚀 开始识别</button>
            <button class="gxh_btn_secondary" id="gxh_btn_reset">🔄 重新选择</button>
          </div>
        </div>
      </div>

      <div class="gxh_panel">
        <h3>📝 识别结果</h3>
        <div class="gxh_result_box" id="gxh_result">
          <div class="gxh_result_empty">
            <span class="gxh_big">👂</span>
            <div>录一段语音或上传音频，AI 帮你转成文字</div>
            <div style="margin-top:8px;font-size:12px;color:rgba(255,255,255,0.3)">
              后端调用七牛 qwen3.8-omni-flash 多模态模型<br>
              支持 wav/mp3/m4a/webm/ogg/flac/aac
            </div>
          </div>
        </div>
        <div class="gxh_model_info" id="gxh_model_info"></div>
      </div>
    </div>
  </div>

  <div class="gxh_footer">
    © 2026 gaoxinhe | 语音识别 | AI 能力由七牛 Modelink 提供
  </div>

  <script src="js/gxh_bg.js"></script>
  <script>
    /**
     * 姓名：gaoxinhe | 学号：24001010223 |
     * 时间：2026-11-23 | 大模型：Trae AI
     */
    const micBtn = document.getElementById('gxh_mic_btn');
    const recStatus = document.getElementById('gxh_rec_status');
    const recTime = document.getElementById('gxh_rec_time');
    const fileInput = document.getElementById('gxh_file_input');
    const audioPreview = document.getElementById('gxh_audio_preview');
    const audioPlayer = document.getElementById('gxh_audio_player');
    const audioName = document.getElementById('gxh_audio_name');
    const audioSize = document.getElementById('gxh_audio_size');
    const btnSend = document.getElementById('gxh_btn_send');
    const btnReset = document.getElementById('gxh_btn_reset');
    const resultBox = document.getElementById('gxh_result');
    const modelInfo = document.getElementById('gxh_model_info');

    let gxh_mediaRecorder = null;
    let gxh_audio_chunks = [];
    let gxh_recorded_file = null;
    let gxh_audio_blob = null;
    let gxh_timer = null;
    let gxh_seconds = 0;
    let gxh_selected_file = null;

    function gxh_format_size(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1024 / 1024).toFixed(2) + ' MB';
    }

    function gxh_format_time(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
    }

    function gxh_show_preview(file, isRecorded) {
      gxh_selected_file = file;
      audioName.textContent = file.name;
      audioSize.textContent = gxh_format_size(file.size);
      const url = URL.createObjectURL(file);
      audioPlayer.src = url;
      audioPreview.style.display = 'block';
      console.log('[gxh ASR] ' + (isRecorded ? '录音' : '上传') + '文件:', file.name, file.size + ' bytes');
    }

    function gxh_reset() {
      gxh_selected_file = null;
      gxh_recorded_file = null;
      gxh_audio_chunks = [];
      fileInput.value = '';
      audioPreview.style.display = 'none';
      resultBox.innerHTML = '<div class="gxh_result_empty"><span class="gxh_big">👂</span><div>录一段语音或上传音频，AI 帮你转成文字</div></div>';
      modelInfo.classList.remove('show');
      recStatus.textContent = '点击麦克风开始录音';
      recStatus.classList.remove('gxh_recording');
      recTime.textContent = '00:00';
      micBtn.classList.remove('gxh_recording');
      micBtn.textContent = '🎙️';
      micBtn.disabled = false;
    }

    micBtn.addEventListener('click', async () => {
      if (gxh_mediaRecorder && gxh_mediaRecorder.state === 'recording') {
        gxh_mediaRecorder.stop();
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        gxh_audio_chunks = [];
        gxh_mediaRecorder = new MediaRecorder(stream);
        gxh_mediaRecorder.ondataavailable = e => {
          if (e.data.size > 0) gxh_audio_chunks.push(e.data);
        };
        gxh_mediaRecorder.onstop = () => {
          clearInterval(gxh_timer);
          stream.getTracks().forEach(t => t.stop());
          gxh_audio_blob = new Blob(gxh_audio_chunks, { type: 'audio/webm' });
          const recordedFile = new File([gxh_audio_blob], 'gxh_record_' + Date.now() + '.webm', { type: 'audio/webm' });
          gxh_recorded_file = recordedFile;
          gxh_show_preview(recordedFile, true);
          console.log('[gxh ASR] 录音完成, 时长:', gxh_format_time(gxh_seconds), '大小:', gxh_format_size(gxh_audio_blob.size));
          recStatus.textContent = '点击麦克风重新录音';
          recStatus.classList.remove('gxh_recording');
          micBtn.classList.remove('gxh_recording');
          micBtn.textContent = '🎙️';
        };

        gxh_mediaRecorder.start();
        gxh_seconds = 0;
        recTime.textContent = '00:00';
        recStatus.textContent = '正在录音...点击停止';
        recStatus.classList.add('gxh_recording');
        micBtn.classList.add('gxh_recording');
        micBtn.textContent = '⏹️';
        gxh_timer = setInterval(() => {
          gxh_seconds++;
          recTime.textContent = gxh_format_time(gxh_seconds);
          if (gxh_seconds >= 300) {
            console.log('[gxh ASR] 超过 5 分钟，自动停止');
            gxh_mediaRecorder.stop();
          }
        }, 1000);
      } catch (e) {
        console.error('[gxh ASR] 录音权限获取失败:', e);
        alert('无法获取麦克风权限：' + e.message + '\n请确保使用 HTTPS 或 localhost 访问，并允许麦克风权限。');
      }
    });

    fileInput.addEventListener('change', () => {
      if (!fileInput.files.length) return;
      const file = fileInput.files[0];
      if (file.size > 20 * 1024 * 1024) {
        alert('文件太大，请选择小于 20MB 的');
        return;
      }
      gxh_show_preview(file, false);
    });

    btnReset.addEventListener('click', () => gxh_reset());

    btnSend.addEventListener('click', async () => {
      if (!gxh_selected_file) {
        alert('请先录音或上传音频！');
        return;
      }
      btnSend.disabled = true;
      btnSend.textContent = '识别中...';
      resultBox.innerHTML = '<div class="gxh_loading"><div class="gxh_spinner"></div><span>AI 正在听这段语音...</span></div>';
      modelInfo.classList.remove('show');

      const fd = new FormData();
      fd.append('gxh_audio', gxh_selected_file);

      try {
        const res = await fetch('/api/asr/recognize', { method: 'POST', body: fd });
        const data = await res.json();
        console.log('[gxh ASR] 接口原始返回:', data);

        if (data.code === 0 && data.data) {
          resultBox.textContent = data.data.text;
          if (data.data.model) {
            modelInfo.innerHTML = `🤖 模型: <b>${data.data.model}</b> · 音频: <b>${gxh_selected_file.name}</b> · 大小: <b>${gxh_format_size(gxh_selected_file.size)}</b>`;
            modelInfo.classList.add('show');
          }
        } else {
          resultBox.innerHTML = '❌ ' + (data.msg || '识别失败');
          console.error('[gxh ASR] 错误:', data);
        }
      } catch (e) {
        console.error('[gxh ASR] 请求异常:', e);
        resultBox.innerHTML = '❌ 请求失败：' + e.message;
      } finally {
        btnSend.disabled = false;
        btnSend.textContent = '🚀 开始识别';
      }
    });
  </script>
</body>
</html>
