<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据库连接测试 - gaoxinhe</title>
  <link rel="stylesheet" href="css/gxh_style.css">
  <style>
    .gxh_form_wrapper {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 40px;
      max-width: 520px;
      margin: 0 auto;
    }
    .gxh_form_group {
      margin-bottom: 20px;
    }
    .gxh_form_group label {
      display: block;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 8px;
    }
    .gxh_form_group input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .gxh_form_group input:focus {
      border-color: #667eea;
    }
    .gxh_form_group input::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }
    .gxh_btn_group {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }
    .gxh_btn {
      flex: 1;
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .gxh_btn_primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }
    .gxh_btn_primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(102, 126, 234, 0.55);
    }
    .gxh_btn_primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .gxh_btn_back {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .gxh_btn_back:hover {
      background: rgba(255, 255, 255, 0.18);
    }
    .gxh_result {
      margin-top: 24px;
      padding: 16px 18px;
      border-radius: 12px;
      font-size: 14px;
      display: none;
      line-height: 1.7;
    }
    .gxh_result_ok {
      display: block;
      background: rgba(76, 175, 80, 0.15);
      border: 1px solid rgba(76, 175, 80, 0.5);
      color: #8bc34a;
    }
    .gxh_result_err {
      display: block;
      background: rgba(244, 67, 54, 0.15);
      border: 1px solid rgba(244, 67, 54, 0.5);
      color: #ef5350;
    }
    .gxh_result pre {
      margin-top: 8px;
      background: rgba(0,0,0,0.25);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <canvas id="gxh_canvas_bg"></canvas>

  <div class="gxh_container">
    <div class="gxh_header">
      <h1>🛢️ MySQL 数据库连接测试</h1>
      <p>gaoxinhe · 24001010223</p>
    </div>

    <div class="gxh_form_wrapper">
      <div class="gxh_form_group">
        <label>用户名</label>
        <input type="text" id="gxh_user" value="root" placeholder="root">
      </div>
      <div class="gxh_form_group">
        <label>密码</label>
        <input type="password" id="gxh_password" value="root" placeholder="root">
      </div>
      <div class="gxh_form_group">
        <label>主机地址</label>
        <input type="text" id="gxh_host" value="localhost" placeholder="localhost">
      </div>
      <div class="gxh_form_group">
        <label>数据库（可选）</label>
        <input type="text" id="gxh_database" value="" placeholder="不填则仅测试连通性">
      </div>

      <div class="gxh_btn_group">
        <button class="gxh_btn gxh_btn_primary" id="gxh_connect_btn">连接数据库</button>
        <button class="gxh_btn gxh_btn_back" onclick="location.href='index.html'">← 返回首页</button>
      </div>

      <div class="gxh_result" id="gxh_result"></div>
    </div>
  </div>

  <div class="gxh_footer">© 2026 gaoxinhe</div>

  <script src="js/gxh_bg.js"></script>
  <script>
    /**
     * 姓名：gaoxinhe | 学号：24001010223 |
     * 时间：2026-11-19 | 大模型：Trae AI
     */
    (function () {
      var gxh_btn = document.getElementById('gxh_connect_btn');
      var gxh_result = document.getElementById('gxh_result');

      function gxh_setResult(gxh_ok, gxh_msg, gxh_data) {
        gxh_result.className = 'gxh_result ' + (gxh_ok ? 'gxh_result_ok' : 'gxh_result_err');
        var gxh_html = (gxh_ok ? '✅ ' : '❌ ') + gxh_msg;
        if (gxh_data) {
          gxh_html += '<pre>' + JSON.stringify(gxh_data, null, 2) + '</pre>';
        }
        gxh_result.innerHTML = gxh_html;
      }

      gxh_btn.addEventListener('click', function () {
        var gxh_user = document.getElementById('gxh_user').value.trim();
        var gxh_password = document.getElementById('gxh_password').value;
        var gxh_host = document.getElementById('gxh_host').value.trim();
        var gxh_database = document.getElementById('gxh_database').value.trim();

        if (!gxh_user || !gxh_host) {
          gxh_setResult(false, '用户名和主机地址不能为空');
          return;
        }

        gxh_btn.disabled = true;
        gxh_btn.textContent = '连接中...';
        gxh_result.className = 'gxh_result';
        gxh_result.innerHTML = '';

        fetch('/api/database/connect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            gxh_user: gxh_user,
            gxh_password: gxh_password,
            gxh_host: gxh_host,
            gxh_database: gxh_database
          })
        })
          .then(function (gxh_res) { return gxh_res.json(); })
          .then(function (gxh_data) {
            console.log('[gxh] 数据库接口返回:', gxh_data);
            if (gxh_data.code === 0) {
              gxh_setResult(true, gxh_data.msg, gxh_data.data);
            } else {
              gxh_setResult(false, gxh_data.msg);
            }
          })
          .catch(function (gxh_err) {
            console.error('[gxh] 前端请求失败:', gxh_err);
            gxh_setResult(false, '请求后端失败：' + gxh_err.message);
          })
          .finally(function () {
            gxh_btn.disabled = false;
            gxh_btn.textContent = '连接数据库';
          });
      });
    })();
  </script>
</body>
</html>
