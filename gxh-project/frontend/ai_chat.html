    .gxh_msg_bubble {

    .gxh_msg_thinking { display: flex; gap: 4px; padding: 4px 0; }
    .gxh_msg_thinking span {

    .gxh_msg_thinking span:nth-child(2) { animation-delay: 0.2s; }

    @keyframes gxh_think {

    .gxh_chat_input_area {

    .gxh_chat_input {
      flex: 1;

      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 14px 18px;
      color: #fff; font-size: 15px; font-family: inherit;
      resize: none; min-height: 52px; max-height: 150px;
      outline: none; transition: border-color 0.3s;

    .gxh_chat_input:focus { border-color: #e74c3c; }
    .gxh_chat_input::placeholder { color: rgba(255, 255, 255, 0.4); }
    .gxh_btn_send, .gxh_btn_clear {
      border: none; border-radius: 12px;
      padding: 12px 24px; font-size: 14px; font-weight: bold;
      cursor: pointer; transition: all 0.3s; font-family: inherit;
    }
    .gxh_btn_send {
      background: linear-gradient(135deg, #e74c3c, #f39c12);
      color: #fff; min-width: 100px;
    }
    .gxh_btn_send:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(231, 76, 60, 0.4);
    }
    .gxh_btn_send:disabled { opacity: 0.5; cursor: not-allowed; }
    .gxh_btn_clear {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);

    }
    .gxh_btn_clear:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
    .gxh_tools_bar {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 12px;
    }
    .gxh_back_link {
      color: rgba(255, 255, 255, 0.7); text-decoration: none;

    }
    .gxh_back_link:hover { color: #f39c12; }
    .gxh_quick_bar {

    }
    .gxh_quick_btn:hover {
      background: rgba(231, 76, 60, 0.25);

    .gxh_scope_hint {

    }
    @media (max-width: 600px) {
      .gxh_input_row { flex-wrap: wrap; }
      .gxh_btn_send { flex: 1; }
    }

<body>

  <div class="gxh_container">

  <script src="js/gxh_bg.js"></script>
  <script>
    /**
     * 姓名：gaoxinhe | 学号：24001010223 |
     * 时间：2026-11-23 | 大模型：Trae AI
     */
    const gxh_history = [];
    const gxh_chat_messages = document.getElementById('gxh_chat_messages');
    const gxh_chat_input = document.getElementById('gxh_chat_input');
    const gxh_btn_send = document.getElementById('gxh_btn_send');
    const gxh_btn_clear = document.getElementById('gxh_btn_clear');
    const gxh_provider_select = document.getElementById('gxh_provider_select');

    function gxh_scroll() { gxh_chat_messages.scrollTop = gxh_chat_messages.scrollHeight; }

    function gxh_add_msg(role, content, providerTag) {
      const gxh_div = document.createElement('div');
      gxh_div.className = 'gxh_msg ' + (role === 'user' ? 'gxh_msg_user' : 'gxh_msg_ai');
      let gxh_tag_html = '';
      if (providerTag && role === 'ai') {
        gxh_tag_html = '<div style="font-size:11px;color:rgba(255,255,255,0.4);margin-bottom:4px;">🤖 ' + providerTag + '</div>';
      }
      gxh_div.innerHTML =
        '<div class="gxh_msg_avatar">' + (role === 'user' ? '👤' : '🥟') + '</div>' +
        '<div class="gxh_msg_bubble">' + gxh_tag_html + '</div>';
      gxh_div.querySelector('.gxh_msg_bubble').appendChild(document.createTextNode(content));
      gxh_chat_messages.appendChild(gxh_div);
      gxh_scroll();
    }

    function gxh_add_thinking() {
      const gxh_div = document.createElement('div');
      gxh_div.className = 'gxh_msg gxh_msg_ai';
      gxh_div.id = 'gxh_thinking';
      const gxh_cur = gxh_provider_select.value === 'qiniu' ? '七牛 Modelink' : '硅基流动 SiliconFlow';
      gxh_div.innerHTML =
        '<div class="gxh_msg_avatar">🥟</div>' +
        '<div class="gxh_msg_bubble"><div style="font-size:11px;color:rgba(255,255,255,0.4);margin-bottom:4px;">🤖 ' + gxh_cur + '</div><div class="gxh_msg_thinking"><span></span><span></span><span></span></div></div>';
      gxh_chat_messages.appendChild(gxh_div);
      gxh_scroll();
    }

    function gxh_remove_thinking() {
      const gxh_t = document.getElementById('gxh_thinking');
      if (gxh_t) gxh_t.remove();
    }

    async function gxh_send(predefined_text) {
      const gxh_text = (predefined_text || gxh_chat_input.value || '').trim();
      if (!gxh_text) return;

      const gxh_provider = gxh_provider_select.value;
      gxh_add_msg('user', gxh_text);
      gxh_history.push({ role: 'user', content: gxh_text });

      if (!predefined_text) {
        gxh_chat_input.value = '';
        gxh_chat_input.style.height = 'auto';
      }
      gxh_btn_send.disabled = true;
      gxh_add_thinking();

      try {
        const gxh_res = await fetch('/api/ai/foodie', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: gxh_history.slice(-10), provider: gxh_provider })
        });
        const gxh_data = await gxh_res.json();
        console.log('[gxh Foodie] provider=' + gxh_provider + ' 接口原始返回:', gxh_data);

        gxh_remove_thinking();

        if (gxh_data.code === 0 && gxh_data.data && gxh_data.data.reply) {
          const gxh_reply = gxh_data.data.reply;
          gxh_history.push({ role: 'assistant', content: gxh_reply });
          const gxh_tag = (gxh_data.data.provider === 'qiniu' ? '🟠 七牛' : '🔵 硅基流动') +
            (gxh_data.data.model ? ' · ' + gxh_data.data.model : '');
          gxh_add_msg('ai', gxh_reply, gxh_tag);
          if (gxh_data.data.usage) {
            console.log('[gxh Foodie] Token 用量:', gxh_data.data.usage);
          }
        } else {
          gxh_add_msg('ai', '❌ ' + (gxh_data.msg || '响应异常'));
        }
      } catch (gxh_err) {
        gxh_remove_thinking();
        console.error('[gxh Foodie] 请求异常:', gxh_err);
        gxh_add_msg('ai', '❌ 请求失败：' + gxh_err.message);
      } finally {
        gxh_btn_send.disabled = false;
        gxh_chat_input.focus();
      }
    }

    gxh_btn_send.addEventListener('click', () => gxh_send());

    gxh_chat_input.addEventListener('keydown', function (gxh_e) {
      if (gxh_e.key === 'Enter' && !gxh_e.shiftKey) {
        gxh_e.preventDefault();
        gxh_send();
      }
    });

    gxh_chat_input.addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 150) + 'px';
    });

    gxh_btn_clear.addEventListener('click', function () {
      gxh_history.length = 0;
      gxh_chat_messages.innerHTML =
        '<div class="gxh_msg gxh_msg_ai">' +
        '<div class="gxh_msg_avatar">🥟</div>' +
        '<div class="gxh_msg_bubble">对话已清空~ 您好！我是中华美食街的客服小e😊 请问想了解什么呢？</div>' +
        '</div>';
    });

    document.querySelectorAll('.gxh_quick_btn').forEach(btn => {
      btn.addEventListener('click', () => gxh_send(btn.dataset.q));
    });
  </script>
</body>
