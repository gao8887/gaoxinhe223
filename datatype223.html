var a = 10,b = 4;

console.log(a-b>0?a:b);
var str = 'hello world',num = 10,ble = true,ud,obj={

// ====== 数7游戏：输出到网页页面 ======
document.write("<h3>数7游戏（1~100，含7或7倍数不显示）</h3>");
for(let i = 1; i <= 100; i++){
    // 判断：7的倍数 或者 包含数字7
    if(i % 7 === 0 || i.toString().includes('7')){
        continue; //满足条件，跳过，不打印
    }
    document.write(i + "&nbsp;&nbsp;"); // 写到网页，空格分隔数字
}
</script>
</div>
</body>
