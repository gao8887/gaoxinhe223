<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js的内部对象Document</title>
</head>
<body>
    
<script>
    //math对象
    console.log(Math.floor(3.9));//向下取整
    console.log(Math.ceil(3.1));//向上取整
    //随机数
    console.log(Math.random());//0~1之间的随机数
    //0~100之间的随机数
    console.log(Math.floor(Math.random()*101));

    //date对象
    var date = new Date();
    console.log(date.getFullYear());//获取年份
    console.log(date.getMonth()+1);//获取月份，注意：月份是从0开始
    console.log(date.getDate());//获取日期
    //获取星期几
    console.log(date.getDay());//0~6，0表示星期天，1表示星期一，依次类推
    //数组
    var arr = [1,2,3,4,5];
    var arr2 = new Array(6,7,8,9,10);
    var arr3 = new Array(5);//创建一个长度为5的数组，元素为undefined
    console.log(arr,arr2,arr3);
</script>

</body>
</html>
